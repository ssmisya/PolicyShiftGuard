[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policyshiftguard"
version = "0.1.0"
description = "Official code for PolicyShiftGuard and the PolicyShiftBench policy-adaptive image guardrail benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "PolicyShiftGuard Authors"}
]
keywords = [
  "multimodal-safety",
  "vision-language-models",
  "guardrails",
  "policy-conditioned-evaluation",
  "dataset-curation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "datasets>=2.19.0",
  "huggingface-hub>=0.23.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "pillow>=10.0.0",
  "pyarrow>=15.0.0",
  "pyyaml>=6.0.0",
  "requests>=2.31.0",
  "scikit-learn>=1.3.0",
  "tabulate>=0.9.0",
  "tqdm>=4.66.0",
  "transformers>=4.49.0",
  "accelerate>=0.30.0",
  "qwen-vl-utils>=0.0.8",
]

[project.urls]
Homepage = "https://github.com/ssmisya/PolicyShiftGuard"
Repository = "https://github.com/ssmisya/PolicyShiftGuard"
Dataset = "https://huggingface.co/datasets/PolicyShiftGuard/PolicyShiftBench"
Documentation = "https://github.com/ssmisya/PolicyShiftGuard/tree/main/docs"

[project.optional-dependencies]
eval = ["vllm>=0.8.0"]
tracking = ["wandb>=0.16.0"]
rl = ["verl"]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[tool.setuptools.packages.find]
include = ["vllm_guard*"]
