name: Bug report
description: Report a reproducible issue in PolicyShiftGuard code.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the exact command you ran.
      render: bash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, CUDA, torch, vLLM, transformers, and GPU type if relevant.
      render: text
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: Error log
      description: Paste the shortest useful traceback or log excerpt.
      render: text
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - data
        - evaluation
        - training
        - parsing / metrics
        - documentation
        - other
    validations:
      required: true
