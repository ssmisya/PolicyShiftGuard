name: CI

on:
  pull_request:
  push:
    branches: [main, master, opensource-cleanup]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
      - name: Compile
        run: python -m compileall -q vllm_guard
      - name: Validate code contracts
        run: python -m vllm_guard.validator.code_validator --output outputs/code_validation_report.json --output-md outputs/code_validation_report.md
